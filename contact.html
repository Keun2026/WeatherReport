<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast - Contact & Info</title>

  <!-- 1. Bootstrap 5 CSS Framework -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 2. Custom External Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">

</head>
<body class="bg-white d-flex flex-column min-vh-100">

  <!-- Site Header -->
  <header class="navbar navbar-expand-lg navbar-dark bg-primary mb-3">
    <nav class="container" style="max-width: 950px;">
      <a class="navbar-brand fw-bold" href="index.html">Weather Forecast</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="contact.html">Contact Us</a>
      </div>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="container my-3 flex-grow-1" style="max-width: 900px;">
    <!-- Contact Form Section -->
    <section>
      <h1 class="h3 mb-4">Contact Us / Submit Feedback</h1>

      <!-- Status Alert with aria-live for screen readers -->
      <div id="formStatus" class="alert d-none" role="status" aria-live="polite"></div>

      <form id="contact" class="card p-4 shadow-sm" novalidate>
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control" 
            id="fullName" 
            aria-describedby="nameError" 
            required
          >
          <div class="invalid-feedback" id="nameError">Name must be at least 2 characters long.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            aria-describedby="emailError" 
            required
          >
          <div class="invalid-feedback" id="emailError">Please enter a valid email address containing '@' and '.'.</div>
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Message / Feedback <span class="text-danger">*</span></label>
          <textarea 
            class="form-control" 
            id="message" 
            rows="4" 
            aria-describedby="messageError" 
            required
          ></textarea>
          <div class="invalid-feedback" id="messageError">Message cannot be empty.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Submit & Download Copy (.txt)</button>
      </form>
    </section>
  </main>

  <!-- Site Footer -->
  <footer class="bg-primary text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0 small">&copy; 2026 Weather Forecast. All rights reserved.</p>
    </div>
  </footer>

  <!-- JS Link -->
  <script src="./js/contact.js"></script>
</body>
</html>
